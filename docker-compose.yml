version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigil_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - JWT_SECRET_KEY=production-secret-key-32-chars-long-min
      - API_KEY=vigil-ai-hackathon-demo-key-2026
      - DATABASE_URL=postgresql+asyncpg://vigil:vigil_secret@postgres:5432/vigil_ai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    container_name: vigil_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil_secret
      POSTGRES_DB: vigil_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vigil_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
